[project]
name = "claimcheck"
version = "0.1.0"
description = "A study assistant that marks which claims in an AI answer to check against the readings."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
claimcheck-eval = "claimcheck.evaluation.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
plots = [
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# The readings and model output contain typographic quotes and dashes, which the
# code has to match on purpose; a split word list reads better than a long literal.
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

