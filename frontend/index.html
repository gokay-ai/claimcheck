<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A study assistant that answers from your readings and marks which claims to check."
    />
    <meta name="theme-color" content="#05060f" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232a3990'/%3E%3Cpath d='M9 16.5l5 5 9-11' fill='none' stroke='%23fbbf24' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>ClaimCheck</title>
    <script>
      // Show the saved theme before the first paint, so the page does not flash.
      try {
        if (localStorage.getItem("claimcheck-theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f7f5ef");
        }
      } catch (error) {
        // Storage can be blocked; the default theme is shown.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
